[package]
name = "amaterasu-host-metrics"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nonary-streams/amaterasu-stats"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { path = "../../crates/module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8.9"

[features]
windows-platform-check = ["dep:windows-sys"]

[dependencies.windows-sys]
version = "0.61"
optional = true
features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
