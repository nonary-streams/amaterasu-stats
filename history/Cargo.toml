[package]
name = "amaterasu-session-history"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { path = "../../../crates/module-sdk" }
amaterasu-storage = { path = "../../../crates/storage" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
